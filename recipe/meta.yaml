{% set name = "cronsim" %}
{% set version = "2.7" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  # 2.7 publishes no sdist on PyPI (wheel only), so the source is the GitHub tag
  # archive. Switch back to the PyPI sdist if upstream resumes publishing one.
  url: https://github.com/cuu508/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 9ae51c8567bfd9375b313d08c9307f7417ab7e7ff935914546a189f4c416c683

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - cronsim
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cuu508/cronsim
  summary: Cron expression parser and evaluator
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - apmorton
