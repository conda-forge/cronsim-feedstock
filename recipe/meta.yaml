{% set name = "cronsim" %}
{% set version = "2.8" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  # 2.7 publishes no sdist on PyPI (wheel only), so the source is the GitHub tag
  # archive. Switch back to the PyPI sdist if upstream resumes publishing one.
  url: https://github.com/cuu508/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: a2fd6492406e28100c309f732b674f90c1aa01d37394aa888d448d88507d6710

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - cronsim
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cuu508/cronsim
  summary: Cron expression parser and evaluator
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - apmorton
